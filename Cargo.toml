[package]
name = "maur-o"
version = "1.0.0"
edition = "2021"
description = "Renders OpenOrienteering Mapper maps to raster images"
license = "GPL-3.0-or-later"
repository = "https://github.com/Noce99/MaUR-O/tree/master"
readme = "README.md"
keywords = ["orienteering", "OpenOrienteeringMapper", "rasterization"]
categories = ["command-line-utilities", "graphics", "parser-implementations", "rendering", "science::geo"]

[lib]
# The package is "maur-o"; a library target name cannot contain a hyphen, so
# it takes the same name with the underscore Cargo would substitute anyway.
name = "maur_o"
path = "src/lib.rs"

[[bin]]
name = "map_to_image"
path = "src/bin/map_to_image.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[[bin]]
name = "create_benchmark"
path = "src/bin/create_benchmark.rs"

[dependencies]
quick-xml = "0.37"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff", "jpeg"] }
tiny-skia = "0.11"
fontdb = "0.21"
rustybuzz = "0.20"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
png = "0.17"
tempfile = "3"

# Resolves font family names (including generic ones like "Sans Serif") the
# same way Qt does on Linux: through the system's actual fontconfig library.
# `fontdb`'s own bundled fontconfig-parser reimplements just enough of
# fontconfig's config-file format to enumerate installed fonts, but not its
# full alias/substitution algorithm (e.g. it does not walk /etc/fonts/conf.d/
# includes), so it can resolve a generic family to a different font than the
# real fontconfig does. Gated the same way fontdb gates its own fontconfig
# feature.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
fontconfig = "0.11"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
