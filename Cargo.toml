[package]
name = "maur-o"
version = "1.0.0"
edition = "2021"
# The floor set by `bytemuck`, which burn pulls in and which declares no
# `rust-version` of its own: it uses `stdarch_x86_avx512`, stable since 1.89.
# The renderer's own dependencies stop at 1.88, set by the `image` crate.
rust-version = "1.89"
description = "Renders OpenOrienteering Mapper maps to raster images"
license = "GPL-3.0-or-later"
repository = "https://github.com/Noce99/MaUR-O"
readme = "README.md"
keywords = ["orienteering", "omap", "openorienteering", "rasterization"]
categories = ["command-line-utilities", "graphics", "parser-implementations", "rendering", "science::geo"]
# Screenshots and sample maps: ~10MB of the package, and needed by neither the
# build nor the tests (whose fixtures live in tests/data/). crates.io rewrites
# the README's relative paths to <repository>/raw/HEAD/..., so the images on
# the crate page are fetched from GitHub rather than from this archive.
exclude = ["mds/", "maps/"]

[lib]
# The package is "maur-o"; a library target name cannot contain a hyphen, so
# it takes the same name with the underscore Cargo would substitute anyway.
name = "maur_o"
path = "src/lib.rs"

[[bin]]
name = "map_to_image"
path = "src/bin/map_to_image.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[[bin]]
name = "create_benchmark"
path = "src/bin/create_benchmark.rs"

[[bin]]
name = "generate_maps_dataset"
path = "src/bin/generate_maps_dataset.rs"

[[bin]]
name = "grid_to_map"
path = "src/bin/grid_to_map.rs"

# The training side. Which backend these are built against is a Cargo feature
# rather than an option they take, since burn's is a type parameter.
[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "image_to_map"
path = "src/bin/image_to_map.rs"

[dependencies]
quick-xml = "0.37"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff", "jpeg"] }
tiny-skia = "0.11"
fontdb = "0.21"
rustybuzz = "0.20"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
png = "0.17"
tempfile = "3"

# `train` is the learner and its metrics, `vision` nothing this uses -- the
# dataset here is the one `generate_maps_dataset` wrote. A backend is picked
# by feature below rather than taken from the defaults, which would pull in
# every one of them. `tui` is the ratatui dashboard `train --dashboard`
# switches to; built in always, since which renderer runs is a runtime
# choice, not one worth a build for.
burn = { version = "0.18", default-features = false, features = ["std", "train", "autodiff", "tui"] }

# The real fontconfig rather than `fontdb`'s bundled parser: only it resolves a
# generic family ("Sans Serif") the way Qt and Mapper do. See `crate::text`.
#
# The cfg is fontdb's platform set less the Apple family and Emscripten: `unix`,
# not `macos`, but with no libfontconfig to find -- harmless for fontdb's pure
# Rust parser, a build failure for this binding to the real library.
#
# `dlopen` opens it by name at first use, so nothing is needed to build and a
# machine without it falls back to fontdb with a warning. Use the Cargo feature,
# not RUST_FONTCONFIG_DLOPEN: the variable reaches the -sys crate alone, leaving
# the wrapper to unwrap a library it never checked was loaded.
[target.'cfg(all(unix, not(any(target_vendor = "apple", target_os = "android", target_os = "emscripten"))))'.dependencies]
fontconfig = { version = "0.11", features = ["dlopen"] }

# Which backend the `net` module and its two binaries are built against.
[features]
# The pure Rust backend: no GPU, no system library, and it builds and runs
# anywhere the renderer does. Slow, and right for a first run and for CI.
# Not really optional despite the name: `net::training` names it outright for
# the backend its metrics are computed on, whatever the model is trained with.
default = ["ndarray"]
ndarray = ["burn/ndarray"]
# The two below are additive on top of it rather than alternatives to it --
# what they change is the device `train` and `image_to_map` ask for, so
# `--features wgpu` is the whole of what a GPU run needs.
#
# Any GPU with a Vulkan/Metal/DX12 driver, which is what a real run wants.
wgpu = ["burn/wgpu"]
# NVIDIA, through CUDA, which is faster again where there is one.
cuda = ["burn/cuda"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
