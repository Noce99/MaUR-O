name: CI

on:
  push:
    branches: [master]
  pull_request:
  # So a run can be started by hand from the Actions tab.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A backtrace costs nothing here and turns a bare "test failed" line in the
  # log into something that can be read without reproducing it locally.
  RUST_BACKTRACE: 1

# A second push to the same branch makes the run in progress pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets --locked
      - name: Test
        run: cargo test --all-targets --locked
      # --all-targets skips the doc tests, and the rendering example in the
      # crate docs is one of them.
      - name: Doc tests
        run: cargo test --doc --locked

  style:
    name: format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # Every public item carries a doc comment (see the missing_docs warning
      # in lib.rs); this is what keeps the links between them from rotting.
      - name: Documentation
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # Makes the rust-version in Cargo.toml a promise rather than a guess.
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets --locked

  gpu-backend:
    # The `net` module is built by every job above, but only against the
    # default `ndarray` backend. `wgpu` is additive on top of it -- what it
    # switches is which device the `train` and `image_to_map` binaries ask
    # for -- so this checks that the switch still compiles. Checked rather
    # than tested: no runner has a GPU to point it at. `cuda` is not here at
    # all, since cudarc wants a CUDA toolkit no runner has either.
    name: the wgpu backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets --locked --features wgpu
