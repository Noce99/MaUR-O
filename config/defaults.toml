# The defaults of every `mauro` option, one table per subcommand
# (`[net.train]` is `mauro net train`), one key per clap argument id.
#
# This file is where they come from: the clap definitions in src/bin/mauro/
# carry none of their own, and `mauro` applies these when it builds its parser
# (src/bin/mauro/defaults.rs). It is read at run time when it is found -- the
# file named by $MAURO_DEFAULTS, else this one, in the source tree the binary
# was built from -- and the copy compiled into the binary is used otherwise.
#
# The terminal interface writes here too: Ctrl+D on a field makes what it holds
# that option's default. Kept in git, so the history of a default is this
# file's.

[render]
resolution = 3
frame = 50

[benchmark.create]
resolution = 3
frame = 50
filter = ""

[benchmark.run]
results = "Results"
tolerance = 3
crops = 0
crop_size = 128
zoom = 512
overview = 2000
filter = ""

[dem]
results = "Results"
config = "config/contours_to_raster.conf"
equidistance = 5

[dem-eval]
results = "Results"

[osm]
size = "1km"
overpass_url = "https://overpass-api.de/api/interpreter"
max_area = 25
standard = "issprom"
details = 3
bundle_width = 12
stop_merge = 3

[ortho]
margin = 50

[net.dataset]
folder = "dataset/map_to_omap_datasets/area_and_lines_v2_10000"
layout_size = 3
background_cell_size = 50
maps = 10000
empty_sides = 0.5
transparent_areas = 0.1
point_symbols = 0.5
content = "areas-and-lines"
resolution = 3
frame = 5
seed = 0
min_resolution = 1
max_resolution = 4
symbol_set = "symbols_sets/simple_ISSprOM.omap"

[net.describe]
model = "all"
networks_dir = "networks"

[net.grid-to-map]
tolerance = 0
same_angle = 0.01
layout_size = 3
background_cell_size = 150
frame = 50
resolution = 3

[net.train]
trainings = "trainings"
gpu = 1
model = "unet"
epochs = 20
batch_size = 10
crop = 96
crops_per_map = 6
base_channels = 64
learning_rate = 0.0003
angle_weight = 0.2
line_weight = 15
point_weight = 1
scale_weight = 1
weight_decay = 0.1
patience = 10
train_share = 0.8
workers = 4
image_valid = 3
seed = 0
size = 64
depth = 4
control_points = 8
samples = 24
temperature_start = 0.08
temperature_end = 0.012
dataset = "dataset/map_to_omap_datasets/almost_issprom_10000"

[net.image-to-map]
same_angle = 0.05
line_threshold = 0.5
min_line = 6
point_threshold = 0.3

[net.show-batches]
into = "batches"
batches = 2
batch_size = 4
crop = 256
crops_per_map = 8
train_share = 0.8
split = "valid"
seed = 0
margin = 0
