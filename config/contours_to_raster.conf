# contours_to_raster.conf -- parameters for the contours_to_raster binary.
# One `key = value` per line. Blank lines and lines starting with # are
# ignored. All twenty-one keys below are required. See Contours-to-Raster.md's
# "## Parameters" section for what each one means.

# Noticeably smaller than contours_step, so the curve detail it captures
# survives the equal-chord resampling contours_step performs afterwards.
bezier_linearization_step = 0.5

# The working resolution the rest of the algorithm operates on
contours_step = 5.0

# Must be small enough that no two genuinely distinct contours land in the
# same pixel; Step 0 crashes on that conflict, naming this parameter, if it
# is not.
rasterization_px_size = 0.5

# At least a couple of rasterization_px_size, so a Jump's or a Heavy
# Object's own buffered polygon covers a real ring of pixels.
heavy_object_width = 3.0

# Much smaller than heavy_object_width: a safety margin, not a second width.
heavy_object_growing = 0.5

# A small multiple of contours_step's point density: enough for a stable
# circle fit, few enough to stay local to the intersection.
circumference_fitting_points_number = 4

# A Slope Line's own position is not always pixel-exact on top of its
# contour; this is how far around it Step 0 searches for the nearest one.
slope_lines_contours_search_radius = 3.0

# A few pixels (rasterization_px_size) at most.
rain_drop_step = 3.0

# The doc's own illustrative value.
sources_per_contour_segment = 3

# A handful of rain_drop_step-sized steps: just enough to carry a drop clear
# of its own starting contour, or clear of an undefined contour it has
# already voted for once.
rain_drop_starting_voting_hysteresis = 1

# Erring toward more ambiguous-vote warnings rather than missing a real one.
undefined_gravity_vote_threshold = 0.8

# Zero stops the out-of-bound area exactly where its own flood-fill leaves
# it; a larger value pads the map edge further in, at the cost of
# overwriting genuine contour/density/no-contour-in-bound pixels near it.
out_of_bound_extra_dilation = 0

# How many steps a Flying End spends seeking the out-of-bound area entirely
# on its own -- no matching against another Flying End at all -- before
# switching to the full process (matching restored, out-of-bound attraction
# dropped) for its remaining steps. A handful of contours_step-sized steps:
# enough to actually reach the border when it's genuinely close, not so many
# that a Flying End with no border nearby wastes a long detour before it
# gets to try matching instead.
growing_oob_seeking_max_steps = 10

# The Growing Process's own square scan window for contour-pixel repulsion,
# in pixels (a real or TEMPORARY_CONTOUR pixel only repels within 2*half+1
# pixels, where half = max(1, growing_window_size_px_contours / 2)).
growing_window_size_px_contours = 10

# The Growing Process's own square scan window for attraction, in pixels: an
# out-of-bound/high-density pixel, or another Flying End to match against,
# is only seen within 2*half+1 pixels, where half = max(1,
# growing_window_size_px_attractions / 2). Kept separate from
# growing_window_size_px_contours so how far the process reaches for
# something to move toward can be tuned independently of how far it reaches
# for something to repel it.
growing_window_size_px_attractions = 30

# How far, as a fraction of contours_step, each case-(c) growing step
# actually moves. 1.0 moves the full contours_step, matching the equal-chord
# resampling distance every other node uses; a smaller value takes more,
# shorter steps instead (finer-grained reaction to nearby pixels, at the
# cost of more steps to reach the border).
growing_step_length = 0.2

# How strongly the Growing Process favors continuing straight ahead, versus
# reacting to nearby out-of-bound/density/other-contour pixels.
growing_previous_distance_direction_weight = 0.0

# Positive: an out-of-bound pixel attracts the Growing Process toward it.
growing_out_of_bound_direction_weight = 0.1

# Positive: a high-density pixel attracts the Growing Process toward it.
growing_density_direction_weight = 0.5

# Negative: any contour pixel repels the Growing Process away from it.
growing_other_contours_direction_weight = -0.5

# Purely a visualization knob (`--create_svg`'s `01_..._step1_growing.svg`):
# scales the four push/pull vectors drawn for each growing step's own case
# (c) -- one per growing_*_direction_weight term above -- so their length is
# something a human can actually see against the map's own scale, without
# changing the Growing Process itself.
growing_visualization_push_pull_vectors_scale = 1.0
