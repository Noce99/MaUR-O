# contours_to_raster.conf -- parameters for the contours_to_raster binary.
# One `key = value` per line. Blank lines and lines starting with # are
# ignored. All thirty-three keys below are required. See Contours-to-Raster.md's
# "## Parameters" section for what each one means.

# Noticeably smaller than contours_step, so the curve detail it captures
# survives the equal-chord resampling contours_step performs afterwards.
bezier_linearization_step = 0.5

# The working resolution the rest of the algorithm operates on
contours_step = 5.0

# Must be small enough that no two genuinely distinct contours land in the
# same pixel; Step 0 crashes on that conflict, naming this parameter, if it
# is not.
rasterization_px_size = 1.0

# At least a couple of rasterization_px_size, so a Jump's or a Heavy
# Object's own buffered polygon covers a real ring of pixels.
heavy_object_width = 3.0

# Much smaller than heavy_object_width: a safety margin, not a second width.
heavy_object_growing = 0.5

# A small multiple of contours_step's point density: enough for a stable
# circle fit, few enough to stay local to the intersection.
circumference_fitting_points_number = 4

# A Slope Line's own position is not always pixel-exact on top of its
# contour; this is how far around it Step 0 searches for the nearest one.
slope_lines_contours_search_radius = 3.0

# Minimum combined confidence weight -- Heavy Object and Jump readings on a
# contour, each weighted by how perpendicular it is to the contour at its own
# contact point -- before Step 2's vote will resolve a contour at all. Below
# this there simply isn't enough evidence to trust either side, and the
# contour is left undefined for Step 3 to resolve instead.
step2_vote_min_total_weight = 0.3

# Minimum margin, in the same units as step2_vote_min_total_weight, the
# winning side of Step 2's vote must lead the losing side by. Below this the
# vote is too close to call, and the contour is left undefined for Step 3 to
# resolve instead.
step2_vote_min_margin = 0.15

# A few pixels (rasterization_px_size) at most.
rain_drop_step = 3.0

# The doc's own illustrative value.
sources_per_contour_segment = 3

# A handful of rain_drop_step-sized steps: just enough to carry a drop clear
# of its own starting contour, or clear of an undefined contour it has
# already voted for once.
rain_drop_starting_voting_hysteresis = 1

# Erring toward more ambiguous-vote warnings rather than missing a real one.
undefined_gravity_vote_threshold = 0.8

# Minimum combined confidence weight -- every Hot (Anti) Rain Drop that hits
# a given contour in one Step 4 Elevation/Anti Elevation Proliferation call,
# each weighted by how far from perpendicular its own direction is to the
# hit's own gravity there -- before Step 4's vote will decide that contour's
# elevation at all in this call. Below this, the contour is left undecided
# for a later, better-placed call to resolve instead.
elevation_vote_min_total_weight = 0.3

# Minimum margin, in the same units as elevation_vote_min_total_weight, the
# winning side of Step 4's own vote must lead the losing side by. Below this
# the vote is still decided (accordance wins a tie) but flagged as a warning.
elevation_vote_min_margin = 0.15

# Master switch for Step 1's whole Growing Process (Close Search, Seeking and
# Matching alike). 0.0 skips all three passes entirely -- every contour is
# left exactly as extracted, dangling Flying Ends and all -- and any nonzero
# value runs the Growing Process normally.
growing_enabled = 1.0

# The Growing Process's own preliminary Close Search pass's own "obvious
# match" distance, in meters: any two Flying Ends closer than this to each
# other are matched outright, before Close Search's own cone-based searches
# ever run and regardless of either one's own forward direction. Kept small,
# since it ignores direction entirely. 0.0 turns it off outright.
obvious_to_close_contour_distance = 2.0

# The Growing Process's own preliminary Close Search pass's own cone's total
# angular width, in degrees, centered on a Flying End's own forward
# direction (continuing past its tip): half this angle to each side of that
# direction.
searching_fov = 40.0

# The Growing Process's own preliminary Close Search pass's own max search
# radius, in meters, for all three of its cone-based searches -- another
# Flying End, an out-of-bound pixel, or a high-density pixel. Kept small:
# this pass exists to catch Flying Ends that are already essentially where
# they need to be, not to replace Seeking/Matching's own, farther-reaching
# physics. 0.0 turns those three off outright (obvious_to_close_contour_distance's
# own check is independent).
searching_distance = 15.0

# How many steps a Flying End spends seeking the out-of-bound area entirely
# on its own -- no matching against another Flying End at all -- before
# switching to the full process (matching restored, out-of-bound attraction
# dropped) for its remaining steps. A handful of contours_step-sized steps:
# enough to actually reach the border when it's genuinely close, not so many
# that a Flying End with no border nearby wastes a long detour before it
# gets to try matching instead.
growing_oob_seeking_max_steps = 100

# The Growing Process's own scan radius, in meters, for contour-pixel force:
# a real or TEMPORARY_CONTOUR pixel only contributes its own contour force
# if it lies within this Euclidean distance of the Flying End (its own pixel
# and its 8 immediate neighbors are always excluded regardless).
contour_force_window = 10.0

# The Growing Process's own scan radius, in meters, for out-of-bound/
# high-density/other-Flying-End force: each only contributes its own
# constant force if it lies within this Euclidean distance of the Flying
# End. Kept separate from contour_force_window so how far the process
# reaches for something to move toward can be tuned independently of how far
# it reaches for something to repel it.
attraction_force_window = 20.0

# The contour-pixel force curve's own repulsion magnitude at zero distance,
# in Newtons (cfmr). A contour pixel right on top of the Flying End would
# push it away this hard; the push fades to zero by contour_force_equilibrium.
contour_force_max_repulsion = 8.0

# The contour-pixel force curve's own equilibrium distance, in meters (cfe):
# where a contour pixel's own force is exactly zero. Closer repels, farther
# attracts (up to contour_force_second_equilibrium).
contour_force_equilibrium = 5.0

# The contour-pixel force curve's own attraction magnitude at
# contour_force_second_equilibrium and beyond, in Newtons (cfma). Negative: a
# gentle pull back toward contour_force_equilibrium for a Flying End that has
# drifted too far from a contour it's meant to stay loosely leashed near.
contour_force_max_attraction = -0.05

# The contour-pixel force curve's own second equilibrium distance, in
# meters (cfse), always greater than contour_force_equilibrium: beyond this,
# the attraction saturates at contour_force_max_attraction rather than
# continuing to grow.
contour_force_second_equilibrium = 10.0

# Constant attraction, in Newtons, from every out-of-bound pixel found
# within attraction_force_window -- summed over every one found, not just
# the nearest.
out_of_bound_force = 0.01

# Constant attraction, in Newtons, from every high-density pixel found
# within attraction_force_window -- summed over every one found.
density_region_force = 0.1

# Constant attraction, in Newtons, from every other pending Flying End found
# within attraction_force_window -- summed over every one found. Only
# applies during the Matching phase, same as matching itself.
flying_end_force = 1.0

# Euclidean distance, in meters, below which two pending Flying Ends merge
# (close a contour into a ring, or splice two contours together). Matching
# phase only.
flying_end_merge_distance = 4.0

# The smallest net force, in Newtons, a Matching-phase integration step is
# allowed -- a nonzero net force weaker than this (density_region_force/
# flying_end_force combined) is scaled up to this magnitude, direction kept,
# so two Flying Ends near the far edge of attraction_force_window don't
# crawl toward a merge over an impractical number of steps. Smaller than
# flying_end_force/density_region_force, so it only kicks in for a genuinely
# weak residual pull, not as a dominant force in its own right. 0.0 turns it
# off.
matching_min_force = 4.0

# How many seconds of simulated time each Growing Process integration step
# advances by: displacement per step is the net force (Newtons, used
# directly as meters/second) times this. 1.0 unless there's a specific
# reason to change it.
grow_time_step = 0.1

# Purely a visualization knob (`--create_svg`'s
# `02_..._step1_growing_seeking.svg`/`03_..._step1_growing_matching.svg`):
# scales the four push/pull vectors drawn for each integration step -- one
# per force term (contour, out-of-bound, density, flying-end) -- so their
# length is something a human can actually see against the map's own scale,
# without changing the Growing Process itself.
growing_visualization_push_pull_vectors_scale = 1.0
